<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with rounded corners -->
  <rect width="512" height="512" fill="#2d2d2d" rx="80"/>

  <!-- Main container with padding -->
  <g transform="translate(32, 32)">
    <!-- Large rectangle on left (purple/blue) -->
    <rect x="0" y="0" width="268" height="448" fill="#667eea" stroke="#1a1a1a" stroke-width="3" rx="12"/>

    <!-- Nested rectangles inside large left block -->
    <rect x="12" y="12" width="122" height="200" fill="#5568d3" stroke="#1a1a1a" stroke-width="2" rx="8"/>
    <rect x="142" y="12" width="114" height="200" fill="#7b8ef7" stroke="#1a1a1a" stroke-width="2" rx="8"/>
    <rect x="12" y="220" width="244" height="216" fill="#4a5bc4" stroke="#1a1a1a" stroke-width="2" rx="8"/>

    <!-- Small nested rects -->
    <rect x="22" y="22" width="52" height="90" fill="#8a9af9" stroke="#1a1a1a" stroke-width="1.5" rx="6"/>
    <rect x="80" y="22" width="48" height="90" fill="#9aaafb" stroke="#1a1a1a" stroke-width="1.5" rx="6"/>
    <rect x="22" y="118" width="102" height="86" fill="#6a7ae5" stroke="#1a1a1a" stroke-width="1.5" rx="6"/>

    <!-- Right column top (green) -->
    <rect x="276" y="0" width="172" height="216" fill="#4CAF50" stroke="#1a1a1a" stroke-width="3" rx="12"/>
    <rect x="288" y="12" width="148" height="90" fill="#66bb6a" stroke="#1a1a1a" stroke-width="2" rx="8"/>
    <rect x="288" y="110" width="148" height="94" fill="#388e3c" stroke="#1a1a1a" stroke-width="2" rx="8"/>

    <!-- Bottom right section divided into 4 blocks -->
    <!-- Top left (cyan) -->
    <rect x="276" y="224" width="82" height="108" fill="#00BCD4" stroke="#1a1a1a" stroke-width="3" rx="12"/>
    <rect x="285" y="233" width="64" height="45" fill="#26c6da" stroke="#1a1a1a" stroke-width="1.5" rx="6"/>

    <!-- Top right (orange) -->
    <rect x="366" y="224" width="82" height="108" fill="#FF9800" stroke="#1a1a1a" stroke-width="3" rx="12"/>
    <rect x="375" y="233" width="64" height="45" fill="#ffa726" stroke="#1a1a1a" stroke-width="1.5" rx="6"/>

    <!-- Bottom left (blue) -->
    <rect x="276" y="340" width="82" height="108" fill="#2196F3" stroke="#1a1a1a" stroke-width="3" rx="12"/>
    <rect x="285" y="349" width="64" height="45" fill="#42a5f5" stroke="#1a1a1a" stroke-width="1.5" rx="6"/>

    <!-- Bottom right (red) -->
    <rect x="366" y="340" width="82" height="108" fill="#F44336" stroke="#1a1a1a" stroke-width="3" rx="12"/>
    <rect x="375" y="349" width="64" height="45" fill="#ef5350" stroke="#1a1a1a" stroke-width="1.5" rx="6"/>
  </g>
</svg>
