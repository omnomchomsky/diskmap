[package]
name = "dm-vibes-gui"
version = "0.1.0"
edition = "2021"

[dependencies]
tauri = { version = "2.1", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dm_core = { path = "../dm_core" }
fs4 = { workspace = true }

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
